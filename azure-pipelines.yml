trigger:
  branches:
    include:
      - main
      - master
      - develop

pr:
  branches:
    include:
      - main
      - master
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.11'

steps:
  - task: UsePythonVersion@0
    displayName: 'Configurar Python'
    inputs:
      versionSpec: '$(pythonVersion)'

  - script: |
      python -m pip install --upgrade pip setuptools wheel
    displayName: 'Actualizar pip'

  - script: |
      cd backend
      python -m pip install -r requirements.txt
    displayName: 'Instalar dependencias del backend'

  - script: |
      cd backend
      mkdir -p test-results
      python -m pytest --junitxml=test-results/pytest.xml
    displayName: 'Ejecutar pruebas del backend'
    env:
      PYTHONPATH: $(Build.SourcesDirectory)/backend

  - task: PublishTestResults@2
    displayName: 'Publicar resultados de pruebas'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'backend/test-results/*.xml'
      failTaskOnFailedTests: true
